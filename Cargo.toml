[package]
name = "ripgrep_native"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "ripgrep_native"
crate-type = ["staticlib"]

[dependencies]
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
